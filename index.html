<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='black'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Havenly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Prevent double-tap to zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          const target = event.target;
          if (target && target.closest && !target.closest('.gm-style') && !target.closest('gmp-map')) {
            event.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Prevent pinch to zoom
      document.addEventListener('touchmove', function(event) {
        if (event.touches.length > 1) {
          const target = event.target;
          if (target && target.closest && !target.closest('.gm-style') && !target.closest('gmp-map')) {
            event.preventDefault();
          }
        }
      }, { passive: false });
    </script>
  </body>
</html>
